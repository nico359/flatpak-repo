name: Flatter

run-name: ${{ inputs.apps }} (${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Apps to build (comma-separated: expenses,loci,pinepal,simplesync,speedometer,camera,flexify,tutanota or "all")'
        required: true
        type: string
        default: 'all'

jobs:
  matrix:
    name: Select apps
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      files-x86_64: ${{ steps.set.outputs.files-x86_64 }}
      files-aarch64: ${{ steps.set.outputs.files-aarch64 }}
      need-gnome: ${{ steps.set.outputs.need-gnome }}
      need-freedesktop: ${{ steps.set.outputs.need-freedesktop }}
      need-llvm21: ${{ steps.set.outputs.need-llvm21 }}
      need-electron: ${{ steps.set.outputs.need-electron }}
    steps:
      - id: set
        run: |
          get_path() {
            case "$1" in
              expenses)    echo 'io.github.nico359.expenses.json' ;;
              loci)        echo 'io.github.nico359.loci.json' ;;
              pinepal)     echo 'io.github.nico359.pinepal.json' ;;
              simplesync)  echo 'io.github.nico359.simplesync.json' ;;
              speedometer) echo 'io.github.nico359.speedometer.json' ;;
              camera)      echo 'io.github.nico359.camera.json' ;;
              flexify)     echo 'io.github.brandonp2412.flexify/io.github.brandonp2412.flexify.yml' ;;
              tutanota)    echo 'com.tutanota.Tutanota/com.tutanota.Tutanota.json' ;;
            esac
          }

          INPUT="${{ inputs.apps }}"
          ALL="expenses loci pinepal simplesync speedometer camera flexify tutanota"

          if [ "${INPUT}" = "all" ]; then
            NAMES="${ALL}"
          else
            NAMES="${INPUT//,/ }"
          fi

          NEED_GNOME=false
          NEED_FREEDESKTOP=false
          NEED_LLVM21=false
          NEED_ELECTRON=false

          FILES_X86_64=""
          FILES_AARCH64=""

          for name in ${NAMES}; do
            path=$(get_path "${name}")
            if [ -n "${path}" ]; then
              # Tutanota is only published for aarch64; skip the redundant
              # x86_64 build so it does not bloat the repository.
              if [ "${name}" != "tutanota" ]; then
                FILES_X86_64="${FILES_X86_64}${path}"$'\n'
              fi
              FILES_AARCH64="${FILES_AARCH64}${path}"$'\n'
            fi
            case "${name}" in
              expenses|loci|pinepal|simplesync|speedometer|camera)
                NEED_GNOME=true ;;
              flexify)
                NEED_FREEDESKTOP=true
                NEED_LLVM21=true ;;
              tutanota)
                NEED_FREEDESKTOP=true
                NEED_LLVM21=true
                NEED_ELECTRON=true ;;
            esac
          done

          if [ -z "${FILES_AARCH64}" ]; then
            echo "No valid apps selected in '${INPUT}'" >&2
            exit 1
          fi

          emit_files() {
            echo "$1<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s' "$2" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          }
          emit_files files-x86_64 "${FILES_X86_64}"
          emit_files files-aarch64 "${FILES_AARCH64}"

          # Only schedule architectures that actually have manifests.
          MATRIX=""
          if [ -n "${FILES_X86_64}" ]; then
            MATRIX='{"arch":"x86_64"},'
          fi
          MATRIX="${MATRIX}{\"arch\":\"aarch64\"}"
          echo "matrix=[${MATRIX}]" >> "$GITHUB_OUTPUT"

          echo "need-gnome=${NEED_GNOME}" >> $GITHUB_OUTPUT
          echo "need-freedesktop=${NEED_FREEDESKTOP}" >> $GITHUB_OUTPUT
          echo "need-llvm21=${NEED_LLVM21}" >> $GITHUB_OUTPUT
          echo "need-electron=${NEED_ELECTRON}" >> $GITHUB_OUTPUT

  flatter:
    name: Flatter (${{ matrix.arch }})
    needs: matrix
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: write
    container:
      image: ghcr.io/andyholmes/flatter/gnome:master
      options: --privileged

    strategy:
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix) }}
      fail-fast: false
      max-parallel: 1

    steps:
      - name: Checkout manifests
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: dnf install -y unzip

      - name: Seed repo from cache branch
        id: seed
        uses: actions/checkout@v4
        with:
          ref: repo-cache
          path: repo
        continue-on-error: true

      - name: Clean git metadata
        if: ${{ steps.seed.outcome == 'success' }}
        run: rm -rf repo/.git

      - name: Init repo if missing
        if: ${{ steps.seed.outcome != 'success' }}
        run: |
          mkdir -p repo
          ostree --repo=repo init --mode=archive

      - name: Install GNOME runtimes
        if: ${{ needs.matrix.outputs.need-gnome == 'true' }}
        run: |
          flatpak install -y flathub \
            org.gnome.Platform//51 \
            org.gnome.Sdk//51 \
            org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08

      - name: Install Freedesktop runtimes
        if: ${{ needs.matrix.outputs.need-freedesktop == 'true' }}
        run: |
          flatpak install -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08

      - name: Install LLVM21 extension
        if: ${{ needs.matrix.outputs.need-llvm21 == 'true' }}
        run: |
          flatpak install -y flathub \
            org.freedesktop.Sdk.Extension.llvm21//25.08

      - name: Install Electron base app
        if: ${{ needs.matrix.outputs.need-electron == 'true' }}
        run: |
          flatpak install -y flathub \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Setup GPG
        if: ${{ github.triggering_actor == github.repository_owner }}
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Prune old versions
        run: |
          mkdir -p repo/refs/remotes
          # Tutanota is aarch64-only now; drop any x86_64 ref left over from
          # earlier builds so its objects get pruned instead of lingering in the
          # published repository forever.
          ostree --repo=repo refs --delete app/com.tutanota.Tutanota/x86_64/master 2>/dev/null || true
          ostree prune --repo=repo --refs-only --depth=2

      - name: Build
        uses: andyholmes/flatter@main
        with:
          files: ${{ matrix.arch == 'aarch64' && needs.matrix.outputs.files-aarch64 || needs.matrix.outputs.files-x86_64 }}
          arch: ${{ matrix.arch }}
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
          upload-bundles: true
          upload-pages-artifact: ${{ matrix.arch == 'aarch64' }}

      - name: Push repo cache
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: repo
          publish_branch: repo-cache
          force_orphan: true
          enable_jekyll: false

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: flatter
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
