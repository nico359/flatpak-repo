 name: Flatter
 
 on:
   schedule:
     - cron: "0 0 * * *"  # rebuild daily
   workflow_dispatch:
 
 jobs:
   flatter:
     name: Flatter (${{ matrix.arch }})
     runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
     container:
       image: ghcr.io/andyholmes/flatter/gnome:master
       options: --privileged
 
     strategy:
       matrix:
         arch: [x86_64, aarch64]
       fail-fast: false
       max-parallel: 1
 
     steps:
       - name: Checkout
         uses: actions/checkout@v4
 
       - name: Setup GPG
         if: ${{ github.triggering_actor == github.repository_owner }}
         id: gpg
         uses: crazy-max/ghaction-import-gpg@v6
         with:
           gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
           passphrase: ${{ secrets.GPG_PASSPHRASE }}
 
       - name: Build
         uses: andyholmes/flatter@main
         with:
           files: |
             io.github.nico359.expenses.json
             io.github.nico359.loci.json
             io.github.nico359.pinepal.json
             io.github.nico359.simplesync.json
             io.github.nico359.speedometer.json
           arch: ${{ matrix.arch }}
           gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
           upload-bundles: true
           upload-pages-artifact: ${{ matrix.arch == 'aarch64' }}
 
   deploy:
     name: Deploy
     runs-on: ubuntu-latest
     needs: flatter
     permissions:
       pages: write
       id-token: write
     environment:
       name: github-pages
       url: ${{ steps.deployment.outputs.page_url }}
 
     steps:
       - name: GitHub Pages
         id: deployment
         uses: actions/deploy-pages@v4
